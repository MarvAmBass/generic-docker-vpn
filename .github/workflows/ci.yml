name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=error

  killswitch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build ./image
      # The leak-test suite runs entirely in containers: GitHub-hosted
      # runners provide NET_ADMIN and /dev/net/tun, and the client side is
      # userspace WireGuard, so no kernel module is required.
      - name: Run kill-switch suite
        run: ./tests/killswitch/run-test.sh
